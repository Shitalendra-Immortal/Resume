<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Contact Test</title>
  <style>
    body { font-family: Arial; padding: 40px; background: #f5f5f5; }
    .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
    button { width: 100%; padding: 15px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
    button:hover { background: #5568d3; }
    .result { margin-top: 20px; padding: 15px; border-radius: 5px; }
    .success { background: #d1fae5; color: #065f46; }
    .error { background: #fee; color: #991b1b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Simple Contact Test</h1>
    <p>Testing: <code>http://localhost:5000/api/contact</code></p>

    <input type="text" id="name" placeholder="Your Name" value="Test User">
    <input type="email" id="email" placeholder="Email" value="test@example.com">
    <textarea id="message" placeholder="Message" rows="4">Hello! This is a test message.</textarea>

    <button onclick="testContact()">Send Message</button>

    <div id="result"></div>
  </div>

  <script>
    async function testContact() {
      const resultDiv = document.getElementById('result');
      const data = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        message: document.getElementById('message').value
      };

      resultDiv.innerHTML = '<div class="result" style="background: #e0f2fe;">Sending...</div>';

      try {
        console.log('Sending to:', 'http://localhost:5000/api/contact');
        console.log('Data:', data);

        const response = await fetch('http://localhost:5000/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        console.log('Response status:', response.status);

        const text = await response.text();
        console.log('Response text:', text);

        const result = JSON.parse(text);
        console.log('Parsed result:', result);

        if (result.success) {
          resultDiv.innerHTML = `<div class="result success">
            ✅ SUCCESS!<br><br>
            <strong>${result.message}</strong><br>
            <small>ID: ${result.data.id}</small>
          </div>`;
        } else {
          resultDiv.innerHTML = `<div class="result error">❌ ${result.message}</div>`;
        }
      } catch (error) {
        console.error('Error:', error);
        resultDiv.innerHTML = `<div class="result error">
          ❌ ERROR: ${error.message}<br><br>
          <small>Check the browser console (F12) for details</small>
        </div>`;
      }
    }
  </script>
</body>
</html>
